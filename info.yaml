# Tiny Tapeout project information
project:
  title:        "Configurable Systolic Accelerator (OS/WS/IS)"      # Project title
  author:       "Pritham Kumar Jena"      # Your name
  discord:      "prithamkjena"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "4x4 Configurable Systolic Accelerator with Output/Weight/Input Stationary dataflows and SRAM storage"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "8x4"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_prithamkjena"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "sram_test_top.v"
    - "sram_512x32_bb.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "Data in bit 0 / Word addr bit 4"
  ui[1]: "Data in bit 1 / Byte select"
  ui[2]: "Data in bit 2"
  ui[3]: "Data in bit 3"
  ui[4]: "Data in bit 4"
  ui[5]: "Data in bit 5"
  ui[6]: "Data in bit 6"
  ui[7]: "Data in bit 7"

  # Outputs
  uo[0]: "Done flag / Data out bit 0"
  uo[1]: "Busy flag / Data out bit 1"
  uo[2]: "Dataflow bit 0 / Data out bit 2"
  uo[3]: "Dataflow bit 1 / Data out bit 3"
  uo[4]: "Data out bit 4"
  uo[5]: "Data out bit 5"
  uo[6]: "Data out bit 6"
  uo[7]: "Data out bit 7"

  # Bidirectional pins (used as inputs by host)
  uio[0]: "Operand bit 0 / Word addr bit 0"
  uio[1]: "Operand bit 1 / Word addr bit 1"
  uio[2]: "Operand bit 2 / Word addr bit 2"
  uio[3]: "Operand bit 3 / Word addr bit 3"
  uio[4]: "Opcode bit 0"
  uio[5]: "Opcode bit 1"
  uio[6]: "Opcode bit 2"
  uio[7]: "Opcode bit 3"

# Do not change!
yaml_version: 6
