# Tiny Tapeout project information
project:
  title:        "Work in Progress"      # Project title
  author:       "Pritham Kumar Jena"      # Your name
  discord:      "prithamkjena"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Work in Progress"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "8x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_prithamkjena"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "sram_64x16_bb.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "Test Input 0"
  ui[1]: "Test Input 1"
  ui[2]: "Test Input 2"
  ui[3]: "Test Input 3"
  ui[4]: "Test Input 4"
  ui[5]: "Test Input 5"
  ui[6]: "Test Input 6"
  ui[7]: "Test Input 7"

  # Outputs
  uo[0]: "Test Output 0"
  uo[1]: "Test Output 1"
  uo[2]: "Test Output 2"
  uo[3]: "Test Output 3"
  uo[4]: "Test Output 4"
  uo[5]: "Test Output 5"
  uo[6]: "Test Output 6"
  uo[7]: "Test Output 7"

  # Bidirectional pins
  uio[0]: "Test IO 0"
  uio[1]: "Test IO 1"
  uio[2]: "Test IO 2"
  uio[3]: "Test IO 3"
  uio[4]: "Test IO 4"
  uio[5]: "Test IO 5"
  uio[6]: "Test IO 6"
  uio[7]: "Test IO 7"

# Do not change!
yaml_version: 6
